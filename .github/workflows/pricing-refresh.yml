# Daily monitor of the published Anthropic pricing page. Regenerates packages/core/src/data/pricing.json from
# the page and, when the rates have moved or a new model appears, opens (or updates) a single PR for review. A new
# release in a known family (Opus, Sonnet, Haiku, Fable) gets its key from the naming convention and lands in that
# PR. Only a name outside every known family opens an issue, so a human can decide the canonical key.
#
# Note: a PR opened with the default GITHUB_TOKEN does not itself trigger the CI workflow (GitHub's loop guard).
# Re-run CI by closing/reopening the PR, or wire a PAT here if automatic CI on these PRs becomes important.
name: Pricing Refresh

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pricing-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: ./.github/actions/setup

      - name: Regenerate pricing.json from the published page
        id: gen
        run: |
          set +e

          bun packages/core/scripts/refresh-pricing.ts --write > refresh.log 2>&1

          echo "code=$?" >> "$GITHUB_OUTPUT"

          set -e

          cat refresh.log

      - name: Fail on an unexpected generator error
        if: steps.gen.outputs.code != '0' && steps.gen.outputs.code != '2'
        env:
          CODE: ${{ steps.gen.outputs.code }}
        run: |
          echo "pricing refresh failed (exit $CODE)"
          exit 1

      - name: Open an issue for an unmapped model
        if: steps.gen.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Pricing page has an unmapped model"

          if gh issue list --state open --search "$title in:title" --json number -q '.[0].number' | grep -q .; then
            echo "an open issue already tracks this; skipping"
            exit 0
          fi

          {
            echo "The daily pricing refresh saw a model on the page outside every known family in"
            echo "\`packages/core/scripts/refresh-pricing.ts\` (\`keyFor\`)."
            echo
            echo "Add a \`NAME_TO_KEY\` entry (or an explicit \`null\` skip), then let the refresh regenerate \`pricing.json\`."
            echo
            echo '```'
            cat refresh.log
            echo '```'
          } > issue-body.md

          gh issue create --title "$title" --body-file issue-body.md

      - name: Format the regenerated file
        if: steps.gen.outputs.code == '0'
        run: bunx prettier --write packages/core/src/data/pricing.json

      - name: Open or update a PR when pricing changed
        if: steps.gen.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- packages/core/src/data/pricing.json; then
            echo "pricing.json already in sync with the page"
            exit 0
          fi

          branch="automated/pricing-refresh"

          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"

          # pricing.json ships inside the published `ccsidekick` package, so CI's changeset gate requires one.
          # A fixed filename keeps this idempotent: the branch is recreated from main on every run, and a
          # re-run overwrites the same file instead of stacking duplicate changesets.
          cat > .changeset/automated-pricing-refresh.md <<'EOF'
          ---
          "ccsidekick": minor
          ---

          Sync the bundled pricing table with the published Anthropic pricing page.
          EOF

          git add packages/core/src/data/pricing.json .changeset/automated-pricing-refresh.md

          git commit -m "chore(pricing): sync pricing.json with published rates"

          git push -f origin "$branch"

          # New keys come from the naming convention, so the PR lists them for a reviewer to check against the model ids.
          {
            echo "Automated daily sync from the [Anthropic pricing page](https://platform.claude.com/docs/en/about-claude/pricing). Review the rate changes before merging."
            if grep -q '^New model key' refresh.log; then
              echo
              grep '^New model key' refresh.log
            fi
          } > pr-body.md

          pr=$(gh pr list --head "$branch" --state open --json number -q '.[0].number')

          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file pr-body.md
            echo "existing PR #$pr updated via force-push"
          else
            gh pr create --base main --head "$branch" \
              --title "chore(pricing): sync pricing.json with published rates" \
              --body-file pr-body.md
          fi
